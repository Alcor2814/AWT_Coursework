<!DOCTYPE HTMl>
<head>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/stylesheet.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/searching.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}">
</head>
<div class="overall">
	<div class="title">
		<h1> Search Comics </h1>
		<div class="toolbar">
			<button class="toolbarButton">
				<img src = {{url_for ('static' , filename = 'img/Hamburger.png')}}>
			</button>
			<div class="toolbarContent">
				<a onclick="window.location.href='{{url_for('collection')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Books.png')}}>
					Collection
				</a>
				<a onclick="window.location.href='{{url_for('weekly')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Calendar.png')}}>
					Weekly
				</a>
				<a onclick="window.location.href='{{url_for('homepage')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Home.png')}}>
					Homepage
				</a>
				<a onclick="window.location.href='{{url_for('settings')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Settings.png')}}>
					Settings
				</a>
				<a onclick="window.location.href='{{url_for('logout')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Logout.png')}}>
					Logout
				</a>
			</div>
		</div>
	</div>
	<div class="search_bar">
		<form id="search_form" action="" method="POST">
			<input type="text" name="search" id="search" placeholder="Search..." required>
			<button type="submit" class="button" value="submit_search">
				Search
			</button>
			<div class="dropdown">
				<button class="dropbtn">Filter</button>
				<div class="dropdown-content">
					<input type="checkbox" id="Marvel_Checkbox" name="Marvel" value="Marvel" checked="checked">
					<label for="Marvel">Marvel</label><br>
					<input type="checkbox" id="DC_Checkbox" name="DC" value="DC Comics" checked="checked">
					<label for="DC">DC Comics</label><br>
				</div>
			</div>
		</form>
	</div>
	<div class="content">
		{% for suggestion in suggestions %}
			<form class="suggestionBox" action="" method="POST">
				<input type = "hidden" name = "volume" value = "{{suggestion}}"/>
				<button type="submit" class="submit_button">
					<p>{{suggestion[1][1]}}</p>
				</button>
			</form>
		{% endfor %}
		{% for comic in comics %}
			<div class="comicBox">
				<form class="linkBox" action="{{url_for('specific_book')}}" method="POST">
					<input type = "hidden" name = "comic" value = "{{comic}}"/>
					<button type="submit" class="comicButton">
						<div class="comic">
							<img src={{comic['image']['small_url']}}>
							{% set name = comic['volume']['name'] %}
							{% if comic['issue_number'] is not none %}
								{% set name = name ~ " #" ~ comic['issue_number'] %}
							{% endif %}
							{% if comic['name'] is not none %}
								{% set name = name ~ " - " ~ comic['name'] %}
							{% endif %}
							<p>{{name}}</p>
						</div>
					</button>
				</form>
			</div>
		{% endfor %}
	</div>
	<div class="information">
		<p>Credit to <a href = "https://comicvine.gamespot.com/api/">ComicVine API</a> for all API calls and Charlotte Morris for all toolbar icons</p>
	</div>
</div>
