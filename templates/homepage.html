<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/stylesheet.css') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
	</head>
	<div class="overall">
		<div class="title">
			<h1> Homepage </h1>
			<div class="toolbar">
			<button class="toolbarButton">
				<img src = {{url_for ('static' , filename = 'img/Hamburger.png')}}>
			</button>
			<div class="toolbarContent">
				<a onclick="window.location.href='{{url_for('settings')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Settings.png')}}>
					Settings
				</a>
				<a onclick="window.location.href='{{url_for('logout')}}'" class="toolbarOption">
					<img src = {{url_for ('static' , filename = 'img/Logout.png')}}>
					Logout
				</a>
			</div>
		</div>
		</div>
		<div class="content">
			<div id = "button_box">
				<button class="button" onclick="window.location.href='{{url_for('collection')}}'">Collection</button>
				<button class="button" onclick="window.location.href='{{url_for('search')}}'">Search</button>
				<button class="button" onclick="window.location.href='{{url_for('weekly')}}'">Weekly Comics</button>
			</div>
			<div id = "user_box">
				<div id = "display_users">
					{% for user in users %}
						<form class="userBox" action="{{url_for('other_collection')}}" method="POST">
							<input type = "hidden" name = "user" value = "{{user}}"/>
							<button type="submit" class="submit_button">
								<p>{{user[0]}}</p>
							</button>
						</form>
					{% endfor %}
				</div>
				<div id = "search_users">
					
				</div>
			</div>
		</div>
		<div class="information">
			<p>Credit to <a href = "https://comicvine.gamespot.com/api/">ComicVine API</a> for all API calls and Charlotte Morris for all toolbar icons</p>
		</div>
	</div>
</html>
